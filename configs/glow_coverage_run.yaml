extends: glow_integration_live.yaml

runtime:
  docker_notes:
    - "Dedicated first whole-system coverage run against live Jericho and LM Studio."
    - "Uses fresh artifact directories to make coverage inspection unambiguous."

policy:
  rollout_depth: 3
  action_candidates: 3
  archive_state_selection_mode: llm_assisted

paths:
  artifacts_dir: artifacts/coverage/glow_coverage_run_001
  trajectory_dir: artifacts/coverage/glow_coverage_run_001/trajectories
  archive_dir: artifacts/coverage/glow_coverage_run_001/archive
  log_dir: artifacts/coverage/glow_coverage_run_001/logs
  summary_dir: artifacts/coverage/glow_coverage_run_001/summaries
  metrics_dir: artifacts/coverage/glow_coverage_run_001/metrics

logging:
  run_log_filename: glow-coverage.log

experiment:
  seed: 17
  batch_size: 1
  max_steps: 12
  max_replay_attempts: 4
  glow_frontier_size: 4
  glow_local_branches_per_root: 2
  glow_frontier_analysis_frequency: 1
  local_exploration_post_gain_cooldown_steps: 0
  branch_commit_steps: 2
