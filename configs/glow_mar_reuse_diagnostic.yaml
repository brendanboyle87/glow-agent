extends: glow_stability_long.yaml

runtime:
  docker_notes:
    - "Dedicated MAR reuse diagnostic against the real GLoW path."
    - "Selection is intentionally biased toward repeated root revisits so local-world-model reuse becomes observable."

policy:
  rollout_depth: 1
  frontier_max_size: 6
  state_selection_selection_penalty: 0.0
  state_selection_visit_penalty: 0.0
  state_selection_native_snapshot_bonus: 1.0

paths:
  artifacts_dir: artifacts/diagnostics/mar_reuse
  trajectory_dir: artifacts/diagnostics/mar_reuse/trajectories
  archive_dir: artifacts/diagnostics/mar_reuse/archive
  log_dir: artifacts/diagnostics/mar_reuse/logs
  summary_dir: artifacts/diagnostics/mar_reuse/summaries
  metrics_dir: artifacts/diagnostics/mar_reuse/metrics

logging:
  run_log_filename: mar_reuse_diagnostic.log

experiment:
  seed: 29
  max_steps: 48
  max_replay_attempts: 16
  glow_frontier_size: 3
  glow_local_branches_per_root: 4
  glow_frontier_analysis_frequency: 1
  enable_mar: true
  enable_potential_value_selection: false
