extends:

project_name: zork-agent

runtime:
  jericho_game_path: games/zork1.z5
  use_live_jericho: false
  docker_image: glow-agent-jericho:latest
  container_workdir: /workspace
  docker_notes:
    - "Run Jericho inside Docker on Linux for compatibility."
    - "When the agent runs in Docker on macOS, use host.docker.internal for LM Studio."

llm:
  provider: lmstudio
  base_url: http://127.0.0.1:1234/v1
  api_key: lm-studio
  model_name: local-model
  temperature: 0.2
  max_tokens: 256
  request_timeout_seconds: 60.0
  offline_stub: true

prompts:
  directory: prompts
  system_file: system.txt
  action_proposal_file: action_proposal.txt
  trajectory_analysis_file: trajectory_analysis.txt
  local_reflection_file: local_reflection.txt
  state_selection_file: state_selection.txt

policy:
  rollout_count: 4
  rollout_depth: 6
  frontier_max_size: 32
  snapshot_retention_limit: 8
  archive_top_k: 8
  action_candidates: 4
  state_selection_mode: heuristic
  inverse_action_pairs:
    open: close
    take: drop
    enter: exit
    turn on: turn off
  immediate_inverse_penalty: 0.75
  repeated_pair_penalty: 1.0
  reversible_no_progress_penalty: 1.0
  repeated_movement_penalty: 1.25
  movement_cycle_penalty: 1.5
  same_region_repeat_penalty: 0.75
  untried_action_bonus: 2.0
  new_object_bonus: 1.25
  inventory_affordance_bonus: 1.0
  examine_read_take_bonus: 0.75
  reflection_supported_try_bonus: 0.75
  candidate_diversity_bonus: 0.35
  repeated_no_gain_penalty: 1.0
  inverse_action_penalty: 0.75
  reversible_toggle_penalty: 0.75
  movement_repeat_penalty: 1.25
  same_cluster_movement_penalty: 1.0
  reflection_supported_avoid_penalty: 1.25
  other_action_penalty: 1.25
  escape_mode_other_action_penalty: 1.5
  action_untried_bonus: 2.0
  action_new_noun_bonus: 1.0
  action_new_noun_interaction_bonus: 1.25
  action_repeated_no_gain_penalty: 1.0
  verb_family_prior_scores:
    inspect: 1.2
    acquire: 1.0
    access: 0.7
    movement: 0.0
    use: -0.2
    aggressive: -1.25
    other: 0.0
  inspect_new_object_bonus: 1.4
  acquire_new_object_bonus: 1.2
  access_new_object_bonus: 0.8
  readable_action_bonus: 0.8
  openable_action_bonus: 0.6
  simple_action_shape_bonus: 0.2
  complex_transitive_penalty: 1.75
  speculative_tool_use_penalty: 1.25
  verb_family_success_bonus: 0.6
  exact_action_success_bonus: 0.75
  exact_action_failure_penalty: 1.0
  object_family_success_bonus: 0.5
  object_family_no_progress_threshold: 2
  object_family_exhaustion_penalty: 2.0
  post_score_scene_exhaustion_penalty: 2.5
  stale_reflection_try_penalty: 0.75
  escape_mode_exit_bonus: 2.0
  discard_inventory_penalty: 2.0
  bulk_inventory_action_penalty: 2.5
  branch_progress_score_weight: 1.0
  branch_progress_inventory_weight: 1.0
  branch_progress_inventory_loss_penalty: 1.25
  branch_inventory_churn_penalty: 2.0
  branch_progress_affordance_weight: 0.35
  branch_progress_exit_weight: 1.0
  branch_progress_location_weight: 1.0
  branch_progress_object_weight: 0.25
  branch_progress_loop_reduction_weight: 0.5
  branch_post_gain_churn_penalty: 1.25
  branch_aggressive_action_penalty: 1.5
  branch_speculative_action_penalty: 0.75
  room_text_only_weight: 0.1
  movement_progress_cap: 0.5
  min_affordance_gain_for_movement_commit: 1
  branch_commit_min_progress_score: 1.0
  branch_commit_movement_ratio_threshold: 0.75
  branch_fail_fast_penalty_threshold: 3.0
  branch_fail_fast_movement_ratio_threshold: 0.75
  branch_fail_fast_min_movement_actions: 3
  branch_fail_fast_bulk_no_progress_steps: 2
  branch_fail_fast_post_gain_churn_actions: 2
  frontier_loop_penalty_weight: 1.0
  frontier_movement_penalty_weight: 1.0
  frontier_room_text_only_penalty_weight: 0.75
  frontier_reversible_state_penalty_weight: 1.0
  frontier_revisit_saturation_penalty_weight: 1.0
  frontier_cluster_revisit_saturation_weight: 0.75
  frontier_reversible_toggle_novelty_scale: 0.2
  frontier_trivial_observation_novelty_scale: 0.35
  frontier_oscillating_pair_novelty_scale: 0.2
  frontier_family_repeat_novelty_decay: 0.75
  frontier_family_repeat_penalty: 0.5
  frontier_family_revisit_saturation_weight: 0.5
  frontier_base_reversible_state_penalty: 0.75
  frontier_oscillating_pair_penalty: 1.0
  frontier_trivial_reversible_penalty: 0.5

paths:
  artifacts_dir: artifacts
  trajectory_dir: artifacts/trajectories
  archive_dir: artifacts/archive
  log_dir: artifacts/logs
  summary_dir: artifacts/summaries

logging:
  level: INFO
  run_log_filename: agent.log

experiment:
  game_id: zork1
  seed: 7
  batch_size: 3
  max_steps: 8
  max_replay_attempts: 2
  frontier_refresh_cadence: 1
  local_exploration_cadence: 3
  branch_commit_steps: 4
  fail_fast_no_durable_gain_steps: 10
  fail_fast_same_cluster_movement_steps: 6
  stub_episode_length: 3
  deterministic: true
