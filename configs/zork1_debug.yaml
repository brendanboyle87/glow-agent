extends: base.yaml

runtime:
  use_live_jericho: false
  docker_notes:
    - "Debug mode runs the scaffold without requiring Jericho or LM Studio."
    - "Use this for smoke tests, CLI wiring checks, and JSONL inspection."

llm:
  offline_stub: true
  temperature: 0.0
  max_tokens: 96

policy:
  rollout_count: 2
  rollout_depth: 3
  frontier_max_size: 12
  snapshot_retention_limit: 2
  archive_top_k: 4
  action_candidates: 3
  state_selection_mode: heuristic

experiment:
  seed: 3
  batch_size: 2
  max_steps: 4
  max_replay_attempts: 1
  frontier_refresh_cadence: 1
  local_exploration_cadence: 2
  stub_episode_length: 2
