extends: base.yaml

runtime:
  jericho_game_path: games/zork1.z5
  use_live_jericho: true
  docker_notes:
    - "Primary path: run the Python process in Docker and Jericho in-process."
    - "LM Studio stays on the host and is reached via host.docker.internal."

llm:
  base_url: http://host.docker.internal:1234/v1
  model_name: local-model
  offline_stub: false
  temperature: 0.1
  max_tokens: 192

policy:
  rollout_count: 6
  rollout_depth: 8
  frontier_max_size: 48
  snapshot_retention_limit: 16
  archive_top_k: 12
  state_selection_mode: heuristic

experiment:
  seed: 11
  batch_size: 5
  max_steps: 25
  max_replay_attempts: 6
  frontier_refresh_cadence: 1
  local_exploration_cadence: 3
  stub_episode_length: 5
